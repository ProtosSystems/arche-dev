name: Portal CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build prerenders pages that construct the Clerk provider, so the
      # build needs syntactically valid keys even though no Clerk call is made.
      # Without these the build has failed on main since April.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci_placeholder

      - name: Portal smoke
        run: npm run smoke:portal

      - name: Docs contract validation
        run: npm run check:docs-contract

      - name: Self-serve flow validation
        run: npm run check:self-serve-flow

      - name: Developer flow tests
        run: npm run test:dev-flow

      - name: Integration contract validation
        run: npm run test:integration-contracts

      - name: Portal targeted tests
        run: npm run test:portal-targeted
